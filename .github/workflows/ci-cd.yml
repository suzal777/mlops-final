name: CI/CD Pipeline for RAG Microservice

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Install backend dependencies
        run: |
          cd backend
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Lint backend
        run: |
          python3 -m pip install flake8
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check backend formatting
        run: |
          python3 -m pip install black
          black --check backend

  test-frontend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Install frontend dependencies
        run: |
          cd frontend
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

  build-and-push:
    needs: [test-backend, test-frontend]
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/rag-backend:latest ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/rag-backend:latest

      - name: Build frontend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/rag-frontend:latest ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/rag-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3

      - name: Deploy with Docker Compose
        run: |
          cd $GITHUB_WORKSPACE
          
          # Pull latest images
          docker compose pull
          
          # Restart services safely
          docker compose up -d --remove-orphans